# Development serves the generated Website artifact directly from its bind mount.
    location = / { return 302 /en/; }
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /website-runtime-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ $uri.html =404; }
